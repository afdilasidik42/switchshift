<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>Roti’O Shift Management – Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#FFF8E7;--sf:#F7ECCF;--c2:#F2E2B4;--bd:#DEC9A0;--tx:#4A3024;--mu:#7A5C4A;--ph:#A88F7C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2B1D16;--sf:#38261D;--c2:#4A3024;--bd:#5E4538;--tx:#FFF8E7;--mu:#CDB89F;--ph:#8F7A68}}
:root[data-theme="dark"]{--bg:#2B1D16;--sf:#38261D;--c2:#4A3024;--bd:#5E4538;--tx:#FFF8E7;--mu:#CDB89F;--ph:#8F7A68}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:14px Inter,Arial,sans-serif}
a,.b,.row{cursor:pointer}h1,h2,h3,p{margin:0}
#app{display:flex;min-height:100vh}
.sb{width:260px;flex:none;background:var(--sf);border-right:1px solid var(--bd);padding:24px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{font-size:24px;font-weight:700;padding:0 14px}.sub{font-size:11px;font-weight:600;color:var(--mu);padding:0 14px 28px}
.lb{font-size:11px;font-weight:600;color:var(--mu);padding:12px 14px 6px}
.nv{display:block;padding:11px 14px;border-radius:9px;margin-bottom:4px;font-weight:500;color:var(--mu)}.nv:hover{background:var(--c2)}.nv.on{background:var(--c2);color:var(--tx);font-weight:700;border:1px solid var(--bd)}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--bd);border-radius:12px;cursor:pointer}
.av{width:34px;height:34px;border-radius:50%;background:var(--c2);border:1px solid var(--bd);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.mn{flex:1;min-width:0}.tb{display:flex;align-items:center;justify-content:space-between;height:72px;padding:0 32px;border-bottom:1px solid var(--bd)}
.tb h2{font-size:18px}.tr{display:flex;gap:18px;align-items:center;color:var(--mu);font-size:13px}
.bell{position:relative;width:34px;height:34px;border:1px solid var(--bd);border-radius:50%;display:grid;place-items:center}.bell i{position:absolute;top:-5px;right:-5px;background:#F5C928;color:#4A3024;font:700 10px sans-serif;border-radius:9px;padding:2px 5px}
.ct{padding:28px 32px 48px;overflow-x:auto}.hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:16px}.hd h1{font-size:24px;margin-bottom:6px}.hd p,.mu{color:var(--mu)}
.b{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:10px 18px;font:600 13px Inter,Arial,sans-serif}.b:hover{background:var(--c2)}.b.p{background:#F5C928;color:#4A3024;border-color:#F5C928}.b.p:hover{opacity:.85}.b.s{padding:6px 12px;font-size:12px}
.card{border:1px solid var(--bd);border-radius:14px;padding:20px;background:var(--bg)}.card h3{font-size:16px}.card>.mu{margin:3px 0 14px;font-size:13px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}.g4 .card{background:var(--sf)}.g4 small{font-size:11px;font-weight:600;color:var(--mu)}.g4 b{display:block;font-size:20px;margin:8px 0 4px}
.g2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;margin-bottom:20px}
table{width:100%;border-collapse:collapse;min-width:420px}th{font-size:11px;color:var(--mu);text-align:left;padding:10px 8px;background:var(--sf)}td{padding:13px 8px;border-bottom:1px solid var(--c2)}tr.row:hover td{background:var(--sf)}tr.sel td{background:var(--c2)}
.ch{display:inline-block;border:1px solid var(--bd);background:var(--c2);border-radius:20px;padding:3px 11px;font-size:11px;font-weight:600;white-space:nowrap}.ch.ok{border-color:var(--tx)}.ch.no{border-style:dashed}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:14px 0 6px}
input,select,textarea{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:9px;padding:11px 12px;font:13px Inter,Arial,sans-serif}textarea{min-height:90px}
.fl{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}.fl>div{flex:1;min-width:150px}.fl label{margin-top:0}
.tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}.tab{border:1px solid var(--bd);border-radius:20px;padding:8px 16px;font-weight:600;font-size:13px;color:var(--mu)}.tab.on{background:var(--c2);color:var(--tx);border-color:var(--tx)}
.gr{display:grid;grid-template-columns:130px repeat(7,minmax(70px,1fr));gap:6px;min-width:760px}.gr>div{padding:10px 8px;border-radius:9px;background:var(--sf);border:1px solid var(--c2);font-size:12px;min-height:54px}.gr .h{background:none;border:0;font-weight:700;min-height:0;color:var(--mu)}.gr .L{color:var(--mu);background:none;border-style:dashed}.gr .me2{outline:2px solid var(--tx)}.gr.ed>div:not(.h){cursor:pointer}
.nt{display:flex;gap:14px;padding:16px;border-bottom:1px solid var(--c2);cursor:pointer;align-items:center}.nt:hover{background:var(--sf)}.dot{width:10px;height:10px;border-radius:50%;background:var(--tx);flex:none}.dot.rd{background:none;border:1px solid var(--bd)}.nt .mn{min-width:0}
.st{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap}.st div{padding:9px 16px;border:1px solid var(--bd);border-radius:20px;font-weight:600;font-size:13px;color:var(--mu)}.st .on{background:var(--c2);color:var(--tx);border-color:var(--tx)}.st .dn{color:var(--tx)}
.kv small{display:block;font-size:11px;font-weight:600;color:var(--mu);margin:14px 0 3px}
#md{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:50;padding:20px}#md>div{background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:24px;width:440px;max-width:100%;max-height:90vh;overflow:auto}
#ts{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:10px;font-weight:600;display:none;z-index:60;max-width:90vw}
.lg{display:flex;min-height:100vh}.lg .l{width:39%;background:var(--sf);padding:72px}.lg .r{flex:1;display:grid;place-items:center;padding:24px}.lg .l .card{margin-top:70px;background:var(--c2);max-width:420px}.lg h1{font-size:30px}.lg form{width:400px;max-width:100%}
@media(max-width:900px){.lg .l{display:none}.sb{width:200px}.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
.sb{background:#4A3024;border-color:#4A3024}.sb .logo{color:#F5C928}.sb .sub,.sb .lb{color:#CDB89F}.sb .nv{color:#F1E4C8}.sb .nv:hover{background:rgba(255,248,231,.12)}.sb .nv.on{background:#F5C928;color:#4A3024;border-color:#F5C928}.sb .me{border-color:rgba(255,248,231,.3);color:#FFF8E7}.sb .me .mu{color:#CDB89F}.sb .av{background:#F5C928;color:#4A3024;border-color:#F5C928}
.tab.on,.st .on{background:#F5C928;color:#4A3024;border-color:#F5C928}.ch.ok{background:#F5C928;color:#4A3024;border-color:#F5C928}
</style></head><body><div id="app"></div><div id="md"></div><div id="ts"></div>
<script>
const $=s=>document.querySelector(s),E=['Ibnu Nadzar','Gong','Arpan','Nopir','Zidan'],DN=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'],DL=['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
const NM={P:'Pagi',S:'Sore',L:'Libur'},TM={P:'07.00–15.00',S:'15.00–23.00'},TS={P:'07-15',S:'15-23'};
let sc={'Ibnu Nadzar':'PPLSSPL','Gong':'SPPLPSL','Arpan':'PLSSPPL','Nopir':'LSPPSLP','Zidan':'PPSLPPS'};
let users=[['EMP-001','Ibnu Nadzar','Karyawan','Aktif'],['EMP-002','Gong','Karyawan','Aktif'],['EMP-003','Arpan','Supervisor','Aktif'],['EMP-004','Nopir','Karyawan','Aktif'],['EMP-005','Zidan','Admin','Aktif']];
let sw=[['TS-012','Nopir','Arpan','2026-10-29',6,'P','S','Ditolak'],['TS-016','Ibnu Nadzar','Zidan','2026-11-01',4,'P','S','Disetujui'],['TS-019','Gong','Nopir','2026-11-03',5,'S','P','Ditolak'],['TS-021','Ibnu Nadzar','Arpan','2026-11-04',6,'P','S','Disetujui'],['TS-024','Ibnu Nadzar','Gong','2026-11-05',0,'P','S','Menunggu'],['TS-025','Gong','Nopir','2026-11-05',1,'P','S','Menunggu'],['TS-026','Arpan','Gong','2026-11-05',2,'S','P','Menunggu'],['TS-027','Nopir','Arpan','2026-11-05',3,'P','S','Menunggu']].map(a=>({id:a[0],by:a[1],w:a[2],iso:a[3],d:a[4],a:a[5],b:a[6],st:a[7]}));
let nt=[['Pengajuan menunggu persetujuan','Pengajuan #TS-024 sedang menunggu persetujuan rekan kerja.','Hari ini · 09.30',0],['Persetujuan rekan diterima','Arpan menyetujui pertukaran shift #TS-021.','Hari ini · 08.45',0],['Jadwal diperbarui','Jadwal kerja minggu depan telah diperbarui oleh admin.','Kemarin · 15.10',0],['Pengajuan ditolak','Pengajuan #TS-019 tidak disetujui supervisor.','04 Nov · 11.20',1],['Pengingat konfirmasi','Mohon konfirmasi penerimaan perubahan jadwal.','03 Nov · 09.00',1]].map(a=>({t:a[0],m:a[1],w:a[2],r:a[3]}));
const R=['Karyawan','Supervisor','Admin'],NAV=[['dash','Dashboard'],['jad','Jadwal Shift'],['tukar','Tukar Shift'],['app','Persetujuan'],['not','Notifikasi'],['riw','Riwayat']];
let st={page:'login',role:'Karyawan',tab:'u',sel:'TS-024',ft:'Menunggu',f:{a:'',p:'',pd:'',r:''},rf:{s:'',q:'',d:''},uf:{q:'',r:''},ef:'',more:0,view:'Mingguan'};
const dt=iso=>{const[,m,d]=iso.split('-');return d+' '+['','Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][+m]};
const sd=x=>(9+x.d)+' Nov',cls=s=>s=='Disetujui'?'ok':s=='Ditolak'?'no':'',chip=s=>`<span class="ch ${cls(s)}">${s=='Disetujui'?'✓ ':s=='Ditolak'?'✕ ':''}${s}</span>`;
const unread=()=>nt.filter(n=>!n.r).length,sh=c=>c=='L'?'Libur':NM[c]+' ('+TM[c]+')';
function toast(m){const t=$('#ts');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2600)}
function modal(h){const m=$('#md');m.innerHTML='<div>'+h+'</div>';m.style.display='grid'}function close(){$('#md').style.display='none'}
$('#md').onclick=e=>{if(e.target.id=='md')close()};
function go(p){if(p=='usr'||p=='kj'){if(st.role!='Admin')return toast('Menu ini hanya untuk Admin');st.tab=p=='usr'?'u':'j';p='adm'}st.page=p;render();scrollTo(0,0)}
function login(e){e.preventDefault();const u=($('#u').value||'').toLowerCase();if(!u||!$('#pw').value)return toast('Email/username dan password wajib diisi');st.role=u.includes('admin')?'Admin':u.includes('spv')||u.includes('supervisor')?'Supervisor':'Karyawan';toast('Masuk sebagai '+st.role);go('dash')}
function role(){st.role=R[(R.indexOf(st.role)+1)%3];if(st.page=='adm'&&st.role!='Admin')st.page='dash';toast('Peran diganti: '+st.role);render()}
function shell(t,sub,body,act=''){const cur=st.page=='adm'?(st.tab=='u'?'usr':'kj'):st.page,n=a=>`<a class="nv ${cur==a[0]?'on':''}" onclick="go('${a[0]}')">${a[1]}</a>`;
return `<div class="sb"><div class="logo">Roti’O</div><div class="sub">SHIFT MANAGEMENT</div><div class="lb">MENU UTAMA</div>${NAV.map(n).join('')}${st.role=='Admin'?'<div class="lb">ADMINISTRASI</div>'+[['usr','Kelola Pengguna'],['kj','Kelola Jadwal']].map(n).join(''):''}
<div class="me" onclick="role()" title="Klik untuk ganti peran (demo)"><div class="av">IN</div><div><b>Ibnu Nadzar</b><div class="mu" style="font-size:12px">${st.role} ⇄</div></div></div></div>
<div class="mn"><div class="tb"><h2>${t}</h2><div class="tr"><span>Kamis, 5 November 2026</span><a class="bell" onclick="go('not')">🔔${unread()?`<i>${unread()}</i>`:''}</a><div class="av b" onclick="out()" title="Keluar">IN</div></div></div>
<div class="ct"><div class="hd"><div><h1>${t}</h1><p>${sub}</p></div>${act}</div>${body}</div></div>`}
function out(){if(confirm('Keluar dari akun?')){st.page='login';render()}}
function dash(){const me=sc['Ibnu Nadzar'],pend=sw.filter(x=>x.st=='Menunggu'&&(x.by==E[0]||x.w==E[0])).length+1;
const acts=[['Pengajuan tukar shift dibuat','Hari ini, 09.30','Menunggu rekan'],['Jadwal minggu depan diperbarui','Kemarin, 15.10','Informasi']];
return shell('Dashboard','Berikut ringkasan jadwal dan aktivitas shift Anda.',`<h3 style="font-size:22px;margin:-6px 0 20px">Selamat pagi, Ibnu!</h3>
<div class="g4"><div class="card"><small>SHIFT HARI INI</small><b>Pagi · 07.00–15.00</b><span class="mu">Hari ini</span></div><div class="card"><small>PENGAJUAN AKTIF</small><b>${pend} pengajuan</b><span class="mu">Perlu dipantau</span></div><div class="card" onclick="go('not')" style="cursor:pointer"><small>NOTIFIKASI BARU</small><b>${unread()} notifikasi</b><span class="mu">Belum dibaca</span></div><div class="card"><small>JADWAL MINGGU INI</small><b>${[...me].filter(c=>c!='L').length} hari kerja</b><span class="mu">Minggu berjalan</span></div></div>
<div class="g2"><div class="card"><h3>Jadwal Shift Mendatang</h3><p class="mu">Ringkasan jadwal kerja Anda</p><table><tr><th>HARI<th>TANGGAL<th>JAM SHIFT<th>STATUS</tr>${[0,1,2,3,4].map(i=>`<tr><td>${DN[i]}<td>${9+i} Nov<td>${me[i]=='L'?'Libur':TM[me[i]].replace('.00','.00')}<td>${me[i]=='L'?chip('Libur'):chip('Terjadwal')}</tr>`).join('')}</table></div>
<div><div class="card" style="margin-bottom:20px"><h3>Aksi Cepat</h3><p class="mu">Akses fitur yang sering digunakan</p><button class="b p" style="width:100%;margin-bottom:10px" onclick="go('tukar')">Ajukan Tukar Shift</button><button class="b" style="width:100%" onclick="go('jad')">Lihat Jadwal Shift</button></div>
<div class="card"><h3>Informasi Terbaru</h3><p class="mu">Pengajuan #TS-024 menunggu persetujuan rekan.</p>${chip('Menunggu')}</div></div></div>
<div class="card"><h3>Aktivitas Terbaru</h3><p class="mu">Riwayat aktivitas akun Anda</p><table>${acts.map(a=>`<tr><td>${a[0]}<td class="mu">${a[1]}<td>${chip(a[2])}</tr>`).join('')}</table></div>`)}
function jad(){const ds=st.view=='Harian'?[0]:[0,1,2,3,4,5,6],ff=st.ef?[st.ef]:E;
return shell('Jadwal Shift','Lihat jadwal kerja berdasarkan minggu dan tanggal.',`<div class="card" style="margin-bottom:20px"><div class="fl"><div><label>PERIODE</label><b style="font-size:16px">09 – 15 November 2026</b></div><div style="flex:none"><button class="b" onclick="toast('Data minggu lain belum tersedia (dummy)')">‹</button> <button class="b" onclick="toast('Data minggu lain belum tersedia (dummy)')">›</button></div><div><label>Filter karyawan</label><select onchange="st.ef=this.value;render()"><option value="">Semua karyawan</option>${E.map(e=>`<option ${st.ef==e?'selected':''}>${e}</option>`).join('')}</select></div><div><label>Tampilan</label><select onchange="st.view=this.value;render()"><option>Mingguan</option><option ${st.view=='Harian'?'selected':''}>Harian</option></select></div></div></div>
<div class="card" style="overflow-x:auto"><div class="gr" style="grid-template-columns:130px repeat(${ds.length},minmax(70px,1fr))"><div class="h">KARYAWAN</div>${ds.map(i=>`<div class="h">${DL[i]} ${9+i}</div>`).join('')}${ff.map(e=>`<div><b>${e}</b></div>`+ds.map(i=>{const c=sc[e][i];return `<div class="${c=='L'?'L':''} ${e==E[0]?'me2':''}">${c=='L'?'Libur':`<b>${NM[c]}</b><br>${TS[c]}`}</div>`}).join('')).join('')}</div></div>
<p class="mu" style="margin-top:16px;font-size:12px">Catatan: data jadwal merupakan contoh/dummy untuk kebutuhan prototype.</p>`,`<button class="b p" onclick="go('tukar')">Ajukan Tukar Shift</button>`)}
function tukar(){const f=st.f,me=sc[E[0]],mine=[0,1,2,3,4,5,6].filter(i=>me[i]!='L'),pp=f.p?sc[f.p]:null,di=f.a!==''?+f.a:null,pc=pp&&di!==null?pp[di]:null,ok=pc&&pc!='L'&&pc!=me[di],step=f.pd?3:f.p?3:f.a!==''?2:1;
return shell('Pengajuan Tukar Shift','Isi detail jadwal yang ingin ditukar dengan rekan kerja.',`<div class="st">${['1. Pilih jadwal','2. Pilih rekan','3. Konfirmasi'].map((s,i)=>`<div class="${i+1==step?'on':i+1<step?'dn':''}">${i+1<step?'✓ ':''}${s}</div>`).join('')}</div>
<div class="g2"><div class="card"><h3>Detail Pertukaran</h3><p class="mu">Pilih jadwal asal dan jadwal rekan yang ingin ditukar</p>
<label>Jadwal Anda</label><select onchange="st.f.a=this.value;st.f.pd='';render()"><option value="">Pilih jadwal Anda</option>${mine.map(i=>`<option value="${i}" ${f.a==i&&f.a!==''?'selected':''}>${DN[i]}, ${9+i} November · ${sh(me[i])}</option>`).join('')}</select>
<label>Rekan kerja</label><select onchange="st.f.p=this.value;st.f.pd='';render()"><option value="">Pilih nama rekan kerja</option>${E.slice(1).map(e=>`<option ${f.p==e?'selected':''}>${e}</option>`).join('')}</select>
<label>Jadwal rekan</label><select onchange="st.f.pd=this.value;render()" ${pp&&di!==null?'':'disabled'}><option value="">${pp&&di!==null?(ok?'Pilih jadwal rekan yang tersedia':'Tidak ada jadwal rekan yang cocok di tanggal ini'):'Pilih jadwal rekan yang tersedia'}</option>${ok?`<option value="1" ${f.pd?'selected':''}>${DN[di]}, ${9+di} November · ${sh(pc)}</option>`:''}</select>
<label>Alasan pertukaran shift</label><textarea placeholder="Tuliskan alasan pengajuan..." oninput="st.f.r=this.value">${f.r}</textarea></div>
<div><div class="card" style="margin-bottom:20px"><h3>Ringkasan Pertukaran</h3><p class="mu">Periksa kembali sebelum mengajukan</p><div class="kv"><small>JADWAL ASAL</small>${di!==null?`<b>Ibnu · ${DN[di]} ${9+di} Nov</b><br><span class="mu">${TM[me[di]]} · Shift ${NM[me[di]]}</span>`:'<span class="mu">Belum dipilih</span>'}<small>JADWAL TUJUAN</small>${f.pd?`<b>${f.p} · ${DN[di]} ${9+di} Nov</b><br><span class="mu">${TM[pc]} · Shift ${NM[pc]}</span>`:'<span class="mu">Rekan · Pilih jadwal<br>Jam shift akan tampil di sini</span>'}</div></div>
<div class="card"><h3>Alur Persetujuan</h3><p class="mu">1. Persetujuan rekan kerja<br>2. Keputusan supervisor</p><div style="text-align:right;margin-top:20px"><button class="b" onclick="st.f={a:'',p:'',pd:'',r:''};go('dash')">Batal</button> <button class="b p" onclick="kirim()">Ajukan</button></div></div></div></div>
<p class="mu" style="font-size:12px">Jadwal hanya berubah setelah seluruh persetujuan yang disyaratkan selesai.</p>`)}
function kirim(){const f=st.f;if(!f.pd)return toast('Lengkapi jadwal, rekan, dan jadwal rekan dulu');if(!f.r.trim())return toast('Alasan pertukaran wajib diisi');
const di=+f.a,id='TS-0'+(28+sw.length-8);sw.push({id,by:E[0],w:f.p,iso:'2026-11-05',d:di,a:sc[E[0]][di],b:sc[f.p][di],st:'Menunggu',r:f.r});
nt.unshift({t:'Pengajuan menunggu persetujuan',m:`Pengajuan #${id} sedang menunggu persetujuan rekan kerja.`,w:'Baru saja',r:0});st.f={a:'',p:'',pd:'',r:''};st.sel=id;toast('Pengajuan #'+id+' berhasil dikirim');go('riw')}
function app(){const L=sw.filter(x=>x.st==st.ft),c=s=>sw.filter(x=>x.st==s).length,x=sw.find(x=>x.id==st.sel)||L[0],canD=st.role!='Karyawan';
return shell('Persetujuan Pengajuan','Tinjau permintaan pertukaran shift sebelum memberikan keputusan.',`<div class="tabs">${[['Menunggu',c('Menunggu')],['Disetujui',6+c('Disetujui')],['Ditolak',c('Ditolak')]].map(t=>`<a class="tab ${st.ft==t[0]?'on':''}" onclick="st.ft='${t[0]}';st.sel='';render()">${t[0]}: ${t[1]}</a>`).join('')}</div>
<div class="g2"><div class="card"><h3>Daftar Pengajuan</h3><p class="mu">Pilih pengajuan untuk melihat detail</p><table><tr><th>PENGAJU<th>TANGGAL<th>STATUS</tr>${L.length?L.map(r=>`<tr class="row ${x&&x.id==r.id?'sel':''}" onclick="st.sel='${r.id}';render()"><td><b>${r.by}</b><br><span class="mu">Tukar shift dengan rekan kerja</span><td>${sd(r)}<td>${chip(r.st)}</tr>`).join(''):'<tr><td colspan=3 class="mu">Tidak ada pengajuan.</tr>'}</table></div>
<div class="card"><h3>Detail Pengajuan</h3>${x?`<p class="mu">Pengajuan #${x.id}</p><div class="kv"><small>PENGAJU</small><b>${x.by}</b><small>REKAN</small><b>${x.w}</b><small>JADWAL ASAL</small>${DN[x.d]}, ${sd(x)} · ${TM[x.a]}<small>JADWAL PENGGANTI</small>${DN[x.d]}, ${sd(x)} · ${TM[x.b]}<small>PERSETUJUAN REKAN</small>${chip('Disetujui')}<small>PEMERIKSAAN JADWAL</small><span class="mu">Periksa benturan dan kebutuhan shift.</span>${x.r?`<small>ALASAN</small>${x.r}`:''}</div>
${x.st=='Menunggu'?`<div style="text-align:right;margin-top:20px"><button class="b" onclick="dec('${x.id}',0)">Tolak</button> <button class="b p" onclick="dec('${x.id}',1)">Setujui</button></div><p class="mu" style="font-size:12px;margin-top:12px">${canD?'Keputusan akan dicatat ke riwayat pengajuan.':'Hanya Supervisor/Admin yang dapat memutuskan (klik kartu profil untuk ganti peran).'}</p>`:`<p style="margin-top:20px">Status: ${chip(x.st)}</p>`}`:'<p class="mu">Pilih pengajuan.</p>'}</div></div>`)}
function dec(id,y){if(st.role=='Karyawan')return toast('Hanya Supervisor/Admin yang dapat memberi keputusan');const x=sw.find(s=>s.id==id);x.st=y?'Disetujui':'Ditolak';
if(y&&sc[x.by][x.d]==x.a&&sc[x.w][x.d]==x.b){const s1=[...sc[x.by]],s2=[...sc[x.w]];s1[x.d]=x.b;s2[x.d]=x.a;sc[x.by]=s1.join('');sc[x.w]=s2.join('')}
if(x.by==E[0])nt.unshift({t:y?'Pengajuan disetujui':'Pengajuan ditolak',m:`Pengajuan #${id} ${y?'disetujui':'tidak disetujui'} supervisor.`,w:'Baru saja',r:0});
toast(`Pengajuan #${id} ${y?'disetujui — jadwal diperbarui':'ditolak'}`);st.sel='';render()}
function notif(){return shell('Notifikasi','Informasi terbaru terkait jadwal dan pengajuan Anda.',`<div class="card" style="padding:8px 4px"><div style="padding:12px 16px"><h3>Semua Notifikasi</h3><span class="mu">Notifikasi terbaru ditampilkan terlebih dahulu</span></div>${nt.map((n,i)=>`<div class="nt" onclick="nt[${i}].r=1;render()"><div class="dot ${n.r?'rd':''}"></div><div class="mn"><b>${n.t}</b><br><span class="mu">${n.m}</span></div><span class="mu" style="white-space:nowrap">${n.w}</span>${chip(n.r?'Sudah dibaca':'Belum dibaca')}</div>`).join('')}<div style="text-align:center;padding:16px"><button class="b" ${st.more?'disabled':''} onclick="more()">${st.more?'Semua sudah dimuat':'Muat lainnya'}</button></div></div>`,`<button class="b" onclick="nt.forEach(n=>n.r=1);toast('Semua ditandai dibaca');render()">Tandai semua dibaca</button>`)}
function more(){st.more=1;nt.push({t:'Jadwal diperbarui',m:'Jadwal minggu lalu telah diarsipkan.',w:'01 Nov · 10.00',r:1},{t:'Selamat datang',m:'Akun Roti’O Shift Management Anda telah aktif.',w:'28 Okt · 08.00',r:1});render()}
function riw(){const f=st.rf,L=sw.slice().reverse().filter(x=>(!f.s||x.st==f.s)&&(!f.d||x.iso==f.d)&&(!f.q||(x.id+x.by+x.w).toLowerCase().includes(f.q.toLowerCase())));
return shell('Riwayat Pengajuan','Lihat catatan pengajuan dan perubahan jadwal sebelumnya.',`<div class="card" style="margin-bottom:20px"><div class="fl"><div><label>Rentang tanggal</label><input type="date" id="rd" value="${f.d}"></div><div><label>Status</label><select id="rs"><option value="">Semua status</option>${['Menunggu','Disetujui','Ditolak'].map(s=>`<option ${f.s==s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Pencarian</label><input id="rq" placeholder="Nama / nomor pengajuan" value="${f.q}"></div><button class="b p" onclick="st.rf={s:$('#rs').value,q:$('#rq').value,d:$('#rd').value};render()">Terapkan</button></div></div>
<div class="card"><h3>Daftar Riwayat</h3><p class="mu">Data dummy untuk kebutuhan prototype</p><table><tr><th>ID PENGAJUAN<th>TANGGAL<th>KARYAWAN<th>JADWAL<th>STATUS<th>AKSI</tr>${L.length?L.map(x=>`<tr class="row" onclick="det('${x.id}')"><td><b>#${x.id}</b><td>${dt(x.iso)}<td>${x.by.split(' ')[0]} / ${x.w.split(' ')[0]}<td>${sd(x)} · ${NM[x.a]}/${NM[x.b]}<td>${chip(x.st)}<td>Detail →</tr>`).join(''):'<tr><td colspan=6 class="mu">Tidak ada data yang cocok.</tr>'}</table><p class="mu" style="font-size:12px;margin-top:14px">Menampilkan ${L.length} dari ${sw.length+7} riwayat pengajuan.</p></div>`)}
function det(id){const x=sw.find(s=>s.id==id);modal(`<h3>Pengajuan #${x.id}</h3><div class="kv"><small>PENGAJU</small>${x.by}<small>REKAN</small>${x.w}<small>TANGGAL DIAJUKAN</small>${dt(x.iso)}<small>JADWAL</small>${DN[x.d]}, ${sd(x)} · ${NM[x.a]} ⇄ ${NM[x.b]}<small>STATUS</small>${chip(x.st)}${x.r?`<small>ALASAN</small>${x.r}`:''}</div><div style="text-align:right;margin-top:20px"><button class="b p" onclick="close()">Tutup</button></div>`)}
function adm(){const q=st.uf.q.toLowerCase(),U=users.filter(u=>(!q||(u[0]+u[1]).toLowerCase().includes(q))&&(!st.uf.r||u[2]==st.uf.r));
const tabs=`<div class="tabs"><a class="tab ${st.tab=='u'?'on':''}" onclick="st.tab='u';render()">Pengguna</a><a class="tab ${st.tab=='j'?'on':''}" onclick="st.tab='j';render()">Jadwal Shift</a></div>`;
if(st.tab=='j')return shell('Kelola Pengguna & Jadwal','Kelola data akun dan jadwal shift untuk unit operasional.',tabs+`<div class="card"><h3>Pengelolaan Jadwal</h3><p class="mu">Klik sel untuk mengubah shift (Pagi → Sore → Libur). Perubahan langsung tampil di Jadwal Shift.</p><div style="overflow-x:auto"><div class="gr ed"><div class="h">KARYAWAN</div>${DL.map((d,i)=>`<div class="h">${d} ${9+i}</div>`).join('')}${E.map(e=>`<div><b>${e}</b></div>`+[...sc[e]].map((c,i)=>`<div class="${c=='L'?'L':''}" onclick="cyc('${e}',${i})">${c=='L'?'Libur':`<b>${NM[c]}</b><br>${TS[c]}`}</div>`).join('')).join('')}</div></div></div>`);
return shell('Kelola Pengguna & Jadwal','Kelola data akun dan jadwal shift untuk unit operasional.',tabs+`<div class="card" style="margin-bottom:20px"><div class="fl"><div style="flex:2"><label>Cari pengguna</label><input id="uq" placeholder="Nama atau ID karyawan" value="${st.uf.q}"></div><div><label>Peran</label><select id="ur"><option value="">Semua peran</option>${R.map(r=>`<option ${st.uf.r==r?'selected':''}>${r}</option>`).join('')}</select></div><button class="b" onclick="st.uf={q:$('#uq').value,r:$('#ur').value};render()">Filter</button><button class="b p" onclick="uf()">Tambah Pengguna</button></div></div>
<div class="card" style="margin-bottom:20px"><h3>Daftar Pengguna</h3><p class="mu">Data pengguna contoh / dummy</p><table><tr><th>ID KARYAWAN<th>NAMA<th>PERAN<th>STATUS<th>AKSI</tr>${U.map(u=>`<tr><td>${u[0]}<td><b>${u[1]}</b><td>${u[2]}<td>${chip(u[3])}<td><a onclick="uf('${u[0]}')"><u>Edit</u></a> · <a onclick="ud('${u[0]}')"><u>Detail</u></a></tr>`).join('')||'<tr><td colspan=5 class="mu">Tidak ada pengguna.</tr>'}</table></div>
<div class="card"><div class="fl"><div style="flex:3"><h3>Pengelolaan Jadwal</h3><span class="mu">Input dan perbarui jadwal shift secara manual untuk unit pilot.</span></div><button class="b p" onclick="st.tab='j';render()">Kelola Jadwal Shift</button></div></div>`)}
function cyc(e,i){const s=[...sc[e]];s[i]={P:'S',S:'L',L:'P'}[s[i]];sc[e]=s.join('');render()}
function ud(id){const u=users.find(x=>x[0]==id);modal(`<h3>${u[1]}</h3><div class="kv"><small>ID</small>${u[0]}<small>PERAN</small>${u[2]}<small>STATUS</small>${u[3]}</div><div style="text-align:right;margin-top:20px"><button class="b p" onclick="close()">Tutup</button></div>`)}
function uf(id){const u=users.find(x=>x[0]==id)||['','','Karyawan','Aktif'];modal(`<h3>${id?'Edit':'Tambah'} Pengguna</h3><label>Nama</label><input id="fn" value="${u[1]}"><label>Peran</label><select id="fr">${R.map(r=>`<option ${u[2]==r?'selected':''}>${r}</option>`).join('')}</select><label>Status</label><select id="fs"><option ${u[3]=='Aktif'?'selected':''}>Aktif</option><option ${u[3]!='Aktif'?'selected':''}>Nonaktif</option></select><div style="text-align:right;margin-top:20px"><button class="b" onclick="close()">Batal</button> <button class="b p" onclick="us('${id||''}')">Simpan</button></div>`)}
function us(id){const n=$('#fn').value.trim();if(!n)return toast('Nama wajib diisi');const r=[$('#fn').value.trim(),$('#fr').value,$('#fs').value];
if(id){const u=users.find(x=>x[0]==id);u[1]=r[0];u[2]=r[1];u[3]=r[2]}else users.push(['EMP-00'+(users.length+1),...r]);close();toast('Data pengguna disimpan');render()}
function render(){$('#app').innerHTML=st.page=='login'?`<div class="lg"><div class="l"><div class="logo" style="padding:0;font-size:34px">Roti’O</div><div class="sub" style="padding:0">SHIFT MANAGEMENT SYSTEM</div><div class="card"><h2 style="font-size:27px;line-height:1.3">Kelola jadwal kerja<br>dan pertukaran shift</h2><p class="mu" style="font-size:18px;margin-top:10px">dalam satu sistem terpusat.</p></div></div><div class="r"><form onsubmit="login(event)"><h1 style="text-align:center">Selamat Datang</h1><p class="mu" style="text-align:center;margin:8px 0 28px">Masuk untuk melanjutkan ke akun Anda</p><label>Email / Username</label><input id="u" placeholder="Masukkan email atau username"><label>Password</label><input id="pw" type="password" placeholder="Masukkan password"><div style="text-align:right;margin:10px 0 24px"><a class="mu" onclick="toast('Fitur reset password belum tersedia (prototype)')"><b>Lupa password?</b></a></div><button class="b p" style="width:100%">Masuk</button><p class="mu" style="text-align:center;margin-top:20px;font-size:12px">Demo: username “admin” = Admin, “spv” = Supervisor, lainnya = Karyawan.<br>Password bebas.</p></form></div></div>`:({dash,jad,tukar,app,not:notif,riw,adm}[st.page])()}
render();
</script></body></html>
